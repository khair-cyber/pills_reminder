name: pills_reminder
description: Pills Reminder - Aplikasi manajemen dan pengingat obat berbasis Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # Versi dikunci agar API yang dipakai pada kode ini sesuai (lihat README).
  flutter_local_notifications: 17.2.4
  timezone: ^0.9.4
  flutter_timezone: 3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
